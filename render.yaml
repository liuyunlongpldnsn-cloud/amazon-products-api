cat > render.yaml <<'EOF'
services:
  - type: web
    name: amazon-products-api
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PLATFORM_NAME
        value: amazon_us
      - key: X_API_KEY
        generateValue: true
      - key: KEEPA_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: amazon-products-db
          property: connectionString

databases:
  - name: amazon-products-db
    plan: free
    databaseName: amazon_products
    user: amazon_user
EOF
